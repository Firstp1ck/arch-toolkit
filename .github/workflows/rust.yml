name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check default features
        run: cargo check
      - name: Test default features
        run: cargo test -- --test-threads=1
      - name: Test all features serially
        run: cargo test --all-features -- --test-threads=1
      - name: Test all features in parallel
        run: cargo test --all-features
      - name: Complexity analyzer contract
        run: bash dev/scripts/complexity_selftest.sh
      - name: Complexity threshold
        run: bash dev/scripts/complexity_report.sh --quiet

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - aur
          - deps
          - index
          - install
          - news
          - sandbox
          - fuzzy-search
          - cache-disk
          - index,fuzzy-search
          - aur,cache-disk
          - deps,aur
          - aur,deps,index,install,news,sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test feature set
        shell: bash
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo test --no-default-features -- --test-threads=1
          else
            cargo test --no-default-features --features "${{ matrix.features }}" -- --test-threads=1
          fi
      - name: Verify Pacsea optional-feature isolation
        if: matrix.features == 'aur,deps,index,install,news,sandbox'
        shell: bash
        run: |
          cargo tree --locked --no-default-features --features "${{ matrix.features }}" > /tmp/pacsea-tree.txt
          if grep -Eq '(^| )fuzzy-matcher v|(^| )dirs v' /tmp/pacsea-tree.txt; then
            echo "Pacsea feature projection unexpectedly enables fuzzy-search or cache-disk dependencies" >&2
            cat /tmp/pacsea-tree.txt >&2
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: Check declared MSRV
        run: cargo check --all-features
